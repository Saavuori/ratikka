services:
  ratikka-caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data:Z
      - caddy-config:/config:Z
    depends_on:
      - ratikka-backend

  ratikka-backend:
    image: ghcr.io/saavuori/ratikka:latest
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.scope=ratikka"
    environment:
      - DIGITRANSIT_API_KEY=${DIGITRANSIT_API_KEY}
      - MML_API_KEY=${MML_API_KEY}
      - REDIS_URL=redis://ratikka-cache:6379
      - MQTT_BROKER=tls://mqtt.hsl.fi:8883
      - PORT=8080
      # Rolling history for the timelapse. A week of trams is about 1.1 GB;
      # unset REPLAY_DIR to record nothing. Buses, metro and trains are
      # ingested only while somebody is watching them, so recording them would
      # leave a history full of holes — hence trams alone.
      - REPLAY_DIR=/data/replay
      - REPLAY_RETENTION_DAYS=7
      - REPLAY_MODES=tram
    volumes:
      # The history has to outlive the container: update.sh recreates it on a
      # five-minute cron, and a week's archive inside the container layer would
      # be lost on every deploy.
      - replay-data:/data/replay
    depends_on:
      - ratikka-cache

  ratikka-cache:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru

  # Note: auto-updates are handled by update.sh cron (every 5 min) instead of Watchtower,
  # because Watchtower is incompatible with rootless Podman on RHEL.



  ratikka-alloy:
    # Pinned deliberately. On `:latest` an unattended restart could pull a new
    # Alloy major and break metrics collection with no change on our side.
    # Dependabot (.github/dependabot.yml, docker-compose ecosystem) proposes bumps. The copy
    # in deploy.sh's heredoc is invisible to it, so bump both together.
    image: docker.io/grafana/alloy:v1.19.2
    restart: unless-stopped
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro,Z
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    environment:
      - GRAFANA_CLOUD_PROMETHEUS_URL=${GRAFANA_CLOUD_PROMETHEUS_URL}
      - GRAFANA_CLOUD_PROMETHEUS_USER=${GRAFANA_CLOUD_PROMETHEUS_USER}
      - GRAFANA_CLOUD_PROMETHEUS_TOKEN=${GRAFANA_CLOUD_PROMETHEUS_TOKEN}
    depends_on:
      - ratikka-backend

volumes:
  caddy-data:
  caddy-config:
  replay-data:


