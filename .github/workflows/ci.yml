name: CI

# A merge to main tags a version from the commit messages and builds an image
# that the host's update.sh cron pulls straight into production (every 5 min —
# Watchtower is incompatible with rootless Podman on RHEL), so this is the only
# gate between a PR and the live site. See docs/CICD.md.
on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (go test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify go.mod is tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' in backend/"; exit 1; }

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # Works on a clean checkout because backend/internal/api/dist/index.html
      # is tracked — the //go:embed all:dist pattern needs at least one file.
      - name: Test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  changelog:
    name: Changelog (renders, no invented versions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # A branch cannot know the version it will ship as: semantic-version picks
      # it at merge time, from every commit since the last tag, and any number of
      # other releases can land while this one is open. So a hand-written
      # `## [vX.Y.Z]` heading is a guess, and guesses drifted — v0.51.1's heading
      # was carrying v0.51.4's and v0.51.9's work while six releases went
      # unannotated. New entries go under `## [Unreleased]`; the release workflow
      # stamps the tag it actually cut onto that heading.
      # Checked against headings this branch ADDS, not the whole file: one
      # pre-v0.51 heading (v0.44.2) was never tagged at all, and that history
      # stays as written.
      - name: Reject invented version headings
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --tags --force --quiet
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit; skipping."
            exit 0
          fi
          added=$(git diff "$base" -- CHANGELOG.md \
                  | grep -oE '^\+## \[v[0-9]+\.[0-9]+\.[0-9]+\]' \
                  | sed 's/^+## //' | tr -d '[]' | sort -u)
          bad=0
          for version in $added; do
            if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              echo "::error file=CHANGELOG.md::$version is not an existing tag. The version is chosen at merge time by semantic-version, not here — put this entry under '## [Unreleased]' and the release workflow will stamp the tag it actually cuts onto that heading."
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]

      # Only the topmost entry may be pending; an [Unreleased] heading buried
      # under released ones means a stamp was missed.
      - name: Reject a stranded [Unreleased] heading
        run: |
          if grep -qiE '^## \[Unreleased\]' CHANGELOG.md \
             && [ "$(grep -nE '^## \[' CHANGELOG.md | head -1 | grep -ic unreleased)" -eq 0 ]; then
            echo "::error file=CHANGELOG.md::An [Unreleased] heading exists but is not the topmost entry — it was never stamped with its release tag."
            exit 1
          fi

      - name: Render changelog
        run: node scripts/build-changelog.js

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # amd64 only, no push. The release workflow does the multi-arch build;
      # this just catches a broken Dockerfile before it reaches main.
      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
