name: CI

# A merge to main builds an image that Watchtower pulls straight into
# production, so this is the only gate between a PR and the live site.
on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (go test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify go.mod is tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' in backend/"; exit 1; }

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # Works on a clean checkout because backend/internal/api/dist/index.html
      # is tracked — the //go:embed all:dist pattern needs at least one file.
      - name: Test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  release-logic:
    name: Release logic (release + changelog scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Exercises the four paths through the release decision against real
      # throwaway repos: heading bumped, nothing new, dependency-only batch,
      # and a mixed batch. A wrong answer here either ships nothing silently
      # or releases something a human meant to hold back.
      - name: Release decision
        run: ./scripts/derive-release.test.sh

      # The entry Renovate writes is what moves the heading, and the heading is
      # the release. This script runs inside Renovate where a silent no-op looks
      # exactly like "nothing to report", so the no-op cases are asserted too.
      - name: Dependency changelog entry
        run: ./scripts/changelog-entry.test.sh

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # amd64 only, no push. The release workflow does the multi-arch build;
      # this just catches a broken Dockerfile before it reaches main.
      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
