name: CI/CD Build and Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'monitoring/**'
      - 'deploy.sh'
      - '.gitignore'

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.changelog_version.outputs.tag }}
      released: ${{ steps.changelog_version.outputs.released }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CHANGELOG.md is the single source of truth for the version. The release
      # tag is whatever the top `## [vX.Y.Z]` heading says — so the deployed
      # version and the changelog can never drift. To cut a release, bump the
      # heading in CHANGELOG.md; if the heading is unchanged (e.g. a docs-only
      # push) the tag already exists and we skip the build entirely.
      - name: Derive version from CHANGELOG
        id: changelog_version
        run: |
          VERSION=$(grep -m1 -oP '^##\s*\[\s*v?\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md || true)
          if [ -z "$VERSION" ]; then
            echo "::error::No version heading (## [vX.Y.Z]) found at the top of CHANGELOG.md"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — CHANGELOG version unchanged, skipping release."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating release tag ${TAG} from CHANGELOG.md"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin "$TAG"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: tag
    if: needs.tag.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Added Step to handle the uppercase repository name ---
      - name: Prepare Repository Name and Metadata
        id: meta
        run: |
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Using the lowercase repo variable here:
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:latest
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:${{ needs.tag.outputs.new_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:${{ github.sha }}
          build-args: |
            VERSION=${{ needs.tag.outputs.new_tag }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          