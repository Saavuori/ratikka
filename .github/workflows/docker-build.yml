name: CI/CD Build and Release

# The version comes from the commit messages, not from CHANGELOG.md.
# paulhatch/semantic-version reads every commit since the last v* tag and picks
# the bump: `feat:` → minor, `!:`/`BREAKING CHANGE:` → major, anything else
# (including `chore(deps):`) → patch. Nothing has to predict the next number,
# so two PRs in flight can never collide over it, and a merge can never
# silently ship nothing because someone forgot to move a heading.
#
# CHANGELOG.md is documentation now: it is in paths-ignore below, it does not
# gate the build, and a changelog-only push republishes the Pages site without
# cutting a release. See docs/CICD.md.
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'monitoring/**'
      - 'scripts/**'
      - '.claude/**'
      - 'deploy.sh'
      - '.gitignore'

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        uses: paulhatch/semantic-version@v6.0.3
        with:
          tag_prefix: "v"
          major_pattern: '/!:|BREAKING CHANGE:/'
          minor_pattern: '/feat(\(.+\))?:/'
          version_format: "${major}.${minor}.${patch}"

      - name: Create and push tag
        run: |
          git tag ${{ steps.version.outputs.version_tag }}
          git push origin ${{ steps.version.outputs.version_tag }}

      # The version is only knowable here, so this is where the changelog heading
      # gets written. Contributors put an entry under `## [Unreleased]`; the tag
      # just cut is stamped onto it and committed back to main. A release with no
      # pending entry (a Dependabot batch, say) is a no-op — it stays unannotated,
      # as before. CHANGELOG.md is in this workflow's paths-ignore, so the commit
      # cannot re-trigger a release; it does trigger deploy-pages.yml, which is
      # what publishes the entry.
      - name: Stamp the release tag onto the [Unreleased] entry
        env:
          TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          if ! grep -qiE '^## \[Unreleased\]' CHANGELOG.md; then
            echo "No [Unreleased] entry; $TAG ships unannotated."
            exit 0
          fi
          sed -i -E "0,/^## \[[Uu]nreleased\].*$/s//## [$TAG] - $(date -u +%Y-%m-%d)/" CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): record $TAG"
          # Another release may have landed while this job ran; rebase onto it
          # rather than clobbering, and never fail the release over the changelog.
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then
              echo "Stamped $TAG onto the changelog."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::warning file=CHANGELOG.md::Could not push the changelog entry for $TAG; stamp it by hand."

  build-and-push:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io needs a lowercase repository path; GITHUB_REPOSITORY is not.
      - name: Prepare Repository Name and Metadata
        id: meta
        run: |
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:latest
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:${{ needs.tag.outputs.new_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:${{ github.sha }}
          build-args: |
            VERSION=${{ needs.tag.outputs.new_tag }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
