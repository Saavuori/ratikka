name: CI/CD Build and Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'monitoring/**'
      - 'deploy.sh'
      - '.gitignore'

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.changelog_version.outputs.tag }}
      released: ${{ steps.changelog_version.outputs.released }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CHANGELOG.md is the single source of truth for the version. The release
      # tag is whatever the top `## [vX.Y.Z]` heading says — so the deployed
      # version and the changelog can never drift. To cut a release, bump the
      # heading in CHANGELOG.md; if the heading is unchanged (e.g. a docs-only
      # push) the tag already exists and we skip the build entirely.
      #
      # The one exception is dependency updates. Dependabot cannot write a
      # changelog entry, so without the fallback below its merges would land on
      # main and never ship — the build is skipped precisely because the heading
      # did not move. When the only new commits since the current tag are
      # dependency updates, we generate the entry, bump the patch, and release.
      # Logic lives in scripts/derive-release.sh so it can be tested outside
      # CI — see scripts/derive-release.test.sh. Release logic that silently
      # ships nothing has bitten this repo before (v0.44.9).
      - name: Derive version from CHANGELOG
        id: changelog_version
        run: ./scripts/derive-release.sh

  build-and-push:
    needs: tag
    if: needs.tag.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      # Check out the tag rather than the triggering SHA. On an automatic
      # dependency release the tag points at the CHANGELOG-bump commit, which
      # is one ahead of github.sha — so building github.sha would ship an image
      # whose embedded version does not match the tag it is published under.
      # For a normal release the tag is at github.sha and this is a no-op.
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.new_tag }}

      - name: Resolve tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Added Step to handle the uppercase repository name ---
      - name: Prepare Repository Name and Metadata
        id: meta
        run: |
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Using the lowercase repo variable here:
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:latest
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:${{ needs.tag.outputs.new_tag }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:${{ steps.commit.outputs.sha }}
          build-args: |
            VERSION=${{ needs.tag.outputs.new_tag }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            GIT_SHA=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          