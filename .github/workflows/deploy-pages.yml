name: Deploy Changelog to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'CHANGELOG.md'
      - 'scripts/build-changelog.js'
      - 'scripts/changelog-template.html'
      - '.github/workflows/deploy-pages.yml'

  # The release workflow stamps the tag it just cut onto the `## [Unreleased]`
  # heading and commits that back to main. That commit is pushed with
  # GITHUB_TOKEN, and GitHub deliberately does not raise `push` events for those
  # — so without this trigger the stamped entry would sit on main unpublished.
  # Republishing after a release that changed nothing here is harmless: the
  # render is deterministic and the `pages` concurrency group below serialises it.
  workflow_run:
    workflows: ["CI/CD Build and Release"]
    types: [completed]

# Allow only one concurrent deployment, skipping runs in-progress
concurrency:
  group: "pages"
  cancel-in-progress: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compile CHANGELOG.md to HTML
        run: node scripts/build-changelog.js

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist-changelog'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
