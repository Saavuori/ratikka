name: Renovate

# Self-hosted Renovate. It has to be self-hosted rather than the Mend-hosted app
# because `postUpgradeTasks` (which writes the changelog entry) runs arbitrary
# commands, and the hosted app doesn't allow those — `allowedCommands` is a
# self-hosted-only setting.
#
# This cron is the only schedule; renovate.json5 deliberately sets none.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC — 07:00 Helsinki in summer, 06:00 in winter
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Run without creating branches or PRs"
        type: boolean
        default: false
      logLevel:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Renovate must not run as GITHUB_TOKEN: pull requests opened with the
      # built-in token don't trigger `pull_request` workflows, so ci.yml would
      # never run on a dependency PR. CI is the only thing that makes these safe
      # to merge on sight, and a merge to main deploys itself — an unverified
      # dependency PR is the one thing this flow cannot afford. A GitHub App
      # installation token does trigger them. Failing loudly here beats a run
      # that looks green and silently does nothing.
      - name: Check the app credentials are configured
        env:
          APP_ID: ${{ secrets.RENOVATE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "::error::RENOVATE_APP_ID / RENOVATE_APP_PRIVATE_KEY are not both set — see README, Dependency updates."
            exit 1
          fi

      # Mints a short-lived installation token scoped to this repo, so nothing
      # long-lived is stored as a secret.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v7

      # An installation token can't call /user, so Renovate can't work out who it
      # is committing as — the identity has to be handed to it. The numeric id is
      # what makes GitHub attribute the commits to the app rather than to a ghost
      # account.
      - name: Resolve the bot commit identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          echo "RENOVATE_USERNAME=${APP_SLUG}[bot]" >> "$GITHUB_ENV"
          echo "RENOVATE_GIT_AUTHOR=${APP_SLUG} <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_ENV"

      # Pinned to a full version on purpose: renovatebot/github-action publishes
      # only exact semver tags, no floating `v46` major tag, so `@v46` fails to
      # resolve before the job starts. Renovate's own github-actions manager keeps
      # this line current.
      - name: Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: renovate.json5
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          # Matched against the fully resolved command. Renovate runs nothing at
          # all unless the command it's about to run matches an entry here, so this
          # is the security boundary — keep it anchored and exact.
          RENOVATE_ALLOWED_COMMANDS: '["^node scripts/changelog-entry\\.js$"]'
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
